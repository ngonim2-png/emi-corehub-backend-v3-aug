version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: emi_app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: emi_corehub
    ports:
      - "5432:5432"
    volumes:
      - emi_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  emi_pg_data:
